services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: moviedb-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-MovieDb_Pass123!}"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - moviedb-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moviedb-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION_STRING: "Server=db,1433;Database=MovieDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-MovieDb_Pass123!};Encrypt=False;TrustServerCertificate=True;"
      PORT: "8080"
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - moviedb-uploads:/app/Uploads/MoviePosters
    restart: unless-stopped

volumes:
  moviedb-sql-data:
  moviedb-uploads:
